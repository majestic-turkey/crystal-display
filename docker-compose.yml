services:
  crystal-display:
    # Replace with your registry image once you publish one:
    # image: ghcr.io/majestic-turkey/crystal-display:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: crystal-display
    restart: unless-stopped

    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 7000
      TZ: UTC

    # Bind only to localhost; nginx on VPS forwards to this.
    ports:
      - "127.0.0.1:7000:7000"

    # Useful once Playwright rendering is added.
    shm_size: "1gb"

    # Persist rendered output/cache across restarts.
    volumes:
      - render-cache:/app/data

    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:7000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  render-cache: